name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Build all targets
      run: VERSION="${{ github.ref_name }}" scripts/build-all.sh

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist
        if-no-files-found: error

  installer-windows:
    name: Windows installer
    runs-on: windows-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Install NSIS
      shell: pwsh
      run: |
        # Chocolatey's install location/PATH propagation has proven
        # unreliable on this runner across three separate attempts (each
        # left makensis.exe genuinely unfindable afterward). Sidestep the
        # whole install-location guessing game: fetch the NSIS zip
        # distribution directly and run it from a known, fixed path.
        $ErrorActionPreference = "Stop"
        $zip = "$env:RUNNER_TEMP\nsis.zip"
        Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\nsis" -Force
        $makensis = Get-ChildItem -Path "$env:RUNNER_TEMP\nsis" -Filter makensis.exe -Recurse | Select-Object -First 1
        if (-not $makensis) {
          throw "makensis.exe not found inside the downloaded NSIS zip"
        }
        Write-Host "makensis at $($makensis.FullName)"
        Add-Content -Path $env:GITHUB_ENV -Value "MAKENSIS=$($makensis.FullName)"

    - name: Build setup
      shell: bash
      run: |
        cd installers/windows
        "$MAKENSIS" -DVERSION="${{ github.ref_name }}" -DSOURCE_EXE="$GITHUB_WORKSPACE/dist/poly-windows-amd64.exe" poly-installer.nsi

    - uses: actions/upload-artifact@v4
      with:
        name: installer-windows
        path: installers/windows/poly-setup-${{ github.ref_name }}.exe
        if-no-files-found: error

  installer-macos:
    name: macOS installer
    runs-on: macos-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Build pkg
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/pkgroot/usr/local/bin"
        lipo -create dist/poly-darwin-amd64 dist/poly-darwin-arm64 -output "$RUNNER_TEMP/pkgroot/usr/local/bin/poly"
        chmod 755 "$RUNNER_TEMP/pkgroot/usr/local/bin/poly"
        mkdir -p installers/macos
        pkgbuild --root "$RUNNER_TEMP/pkgroot" \
          --identifier eu.candygate.poly \
          --version "${{ github.ref_name }}" \
          --install-location / \
          "installers/macos/poly-macos-${{ github.ref_name }}.pkg"

    - uses: actions/upload-artifact@v4
      with:
        name: installer-macos
        path: installers/macos/poly-macos-${{ github.ref_name }}.pkg
        if-no-files-found: error

  installer-desktop-windows:
    name: Poly Desktop (Windows)
    runs-on: windows-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: desktop/package-lock.json

    - name: Install dependencies
      working-directory: desktop
      run: npm ci

    - name: Build Poly Desktop installer
      working-directory: desktop
      run: npm run dist:win

    - uses: actions/upload-artifact@v4
      with:
        name: installer-desktop-windows
        path: desktop/dist/poly-desktop-setup-*.exe
        if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [ build, installer-windows, installer-macos, installer-desktop-windows ]
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: assets
        merge-multiple: true

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        cd assets
        # Stable, version-free aliases alongside the versioned files, so
        # .../releases/latest/download/poly-setup.exe (used by the READMEs
        # and the site) keeps working release after release without
        # editing a link every time.
        cp poly-setup-*.exe poly-setup.exe
        cp poly-macos-*.pkg poly-macos.pkg
        cp poly-desktop-setup-*.exe poly-desktop-setup.exe
        gh release create "${{ github.ref_name }}" \
          poly-* checksums.txt \
          --generate-notes
